name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Lint, Test & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint & Unit Tests
        run: pnpm lint && pnpm test

      - name: Sync & Deploy to Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || '123.58.219.165' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          if [ -n "$SERVER_SSH_KEY" ]; then
            echo "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          elif [ -n "$SERVER_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
            export SSHPASS="$SERVER_PASSWORD"
            SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=accept-new"
          else
            echo "Error: 请在 GitHub 仓库 Settings -> Secrets -> Actions 中配置 SERVER_PASSWORD 或 SERVER_SSH_KEY"
            exit 1
          fi

          echo "==> [1/2] 正在同步最新代码到服务器 ${SERVER_USER}@${SERVER_HOST}..."
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.git' \
            --exclude '.env.local' \
            -e "$SSH_CMD" \
            ./ "${SERVER_USER}@${SERVER_HOST}:~/resume-ok/"

          echo "==> [2/2] 正在服务器上构建并平滑重启服务..."
          $SSH_CMD "${SERVER_USER}@${SERVER_HOST}" "cd ~/resume-ok && \
            pnpm install --frozen-lockfile && \
            pnpm run db:migrate && \
            NODE_OPTIONS='--max-old-space-size=1536' pnpm run build && \
            pm2 restart resume-ok --update-env"
